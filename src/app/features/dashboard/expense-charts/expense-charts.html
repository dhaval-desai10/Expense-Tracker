<section class="grid grid-cols-1 gap-6 xl:grid-cols-2 stagger-children">

  <!-- Spending by Category (Doughnut) -->
  <div class="glass-card p-6">
    <div class="mb-5">
      <h2 class="text-lg font-bold text-white">
        Spending by Category
      </h2>
      <p class="mt-1 text-sm text-slate-400">
        See how your expenses are distributed.
      </p>
    </div>

    <div class="chart-container">
      <canvas #categoryCanvas></canvas>
    </div>
  </div>

  <!-- Income vs Expenses (Bar) -->
  <div class="glass-card p-6">
    <div class="mb-5">
      <h2 class="text-lg font-bold text-white">
        Income vs Expenses
      </h2>
      <p class="mt-1 text-sm text-slate-400">
        Compare your total money received and spent.
      </p>
    </div>

    <div class="chart-container">
      <canvas #comparisonCanvas></canvas>
    </div>
  </div>

  <!-- Monthly Spending Trend (Line) -->
  <div class="glass-card p-6 xl:col-span-2">
    <div class="mb-5">
      <h2 class="text-lg font-bold text-white">
        Monthly Spending Trend
      </h2>
      <p class="mt-1 text-sm text-slate-400">
        Track how your expenses change over time.
      </p>
    </div>

    <div class="chart-container">
      <canvas #monthlyCanvas></canvas>
    </div>
  </div>

</section>
